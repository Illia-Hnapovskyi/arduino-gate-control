# Supabase pauses a free project after seven days without database activity, and
# a paused project takes the whole account side of the game down with it: no
# sign-in, no profile, no saved results, no leaderboard. The gate, the radar and
# the demo keep working, because they never touch the server.
#
# The leaderboard is the cheapest honest wake-up call: it is public, needs no
# secret, and really does query Postgres, so it counts as activity rather than
# just reaching Vercel.
#
# A failure here is worth seeing — it means the database is already unreachable.
name: keep-database-awake

on:
  schedule:
    # Every third day. Well inside the seven-day window even if a run is skipped,
    # and GitHub delays scheduled jobs under load, so the margin is deliberate.
    - cron: "17 6 */3 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Query the leaderboard
        run: |
          set -euo pipefail
          url="https://arduino-gate-game.vercel.app/api/stats?action=leaderboard"
          status=$(curl -sS -o response.json -w '%{http_code}' --max-time 30 --retry 2 --retry-delay 10 "$url")
          echo "HTTP $status"
          head -c 400 response.json || true
          echo
          if [ "$status" != "200" ]; then
            echo "::error::The database did not answer. If the project is paused, restore it in the Supabase dashboard."
            exit 1
          fi
